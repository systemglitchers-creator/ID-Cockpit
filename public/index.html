<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9f0e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ID Cockpit">
<link rel="apple-touch-startup-image" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1290x2796.5f5b9a96.png">
<link rel="apple-touch-startup-image" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1179x2556.a2872854.png">
<link rel="apple-touch-startup-image" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1284x2778.6b73ff0d.png">
<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1170x2532.5dee2dbc.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1242x2688.d539714a.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1125x2436.a88f9bb2.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" href="icons/splash-828x1792.cb7a7b55.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.72faf33d.png">
<title>ID Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ID Cockpit — apothecary: deep clinical green on pale sage.
   Every colour in the app comes from the block below. There are no hardcoded
   hexes outside it, and no copy of any of it in JavaScript — app.js reads --acc
   from here. Swapping this block swaps the app. */
:root{
  --acc:#2f6b4a; --acc-d:#245139;
  --gold:#b8892f; --gold-txt:#7a6224; --gold-bg:#f2ecd8; --gold-bd:#ddd0aa; --read:#9c7d33;
  --bg:#f2f6f0; --soft:#e9f0e7; --card:#fdfffc; --on-acc:#fdfffc;
  --line:#dce7db; --hair:#e6efe4; --track:#dfe9dd; --node-track:#d7e4d5; --sheet-track:#dde8db;
  --box:#c2d2c0; --pip:#d3e0d1; --quest-bd:#b6cfb9; --grab:#c9d8c7;
  --txt:#1d2b22; --mut:#6d8074; --faint:#7e9080; --numeral:#93a695; --strike:#8f9f8d;
  --chip-bg:#e7efe5; --chip-txt:#2f6b4a;
  --alt-hover:#dde9db; --undo-bd:#cbdac9; --pill-bd:#dae6d8;
  --behind:#a85a2c; --ahead:#3f7d55;
  /* translucent + shadow tints. rgba() cannot take a hex var, so these are
     their own tokens — and they are exactly what a 6-char-hex audit misses. */
  --tabs-bg:rgba(233,240,231,.94); --sheet-sh:rgba(24,50,32,.24);
  /* Depth. Shadows carry the palette's own hue — a neutral grey shadow over a
     green ground reads as dirt rather than distance. */
  --sh-1:0 1px 2px rgba(20,45,30,.05);
  --sh-2:0 1px 2px rgba(20,45,30,.05),0 10px 24px -12px rgba(20,45,30,.16);
  --sh-3:0 1px 2px rgba(20,45,30,.05),0 10px 24px -12px rgba(20,45,30,.18),0 28px 56px -28px rgba(20,45,30,.22);
  --edge:.5px solid rgba(47,107,74,.11);
  --scrim:rgba(20,40,28,.38); --card-sh:rgba(30,70,45,.10);
  --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}

/* ---- iOS fit -------------------------------------------------------------
   html carries the background because body's gradient paints a frame later, and
   until it does the page shows the browser's default white. */
html{background:var(--bg);-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a{-webkit-touch-callout:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(178deg,#f7faf6 0%,#f2f6f0 46%,#eaf1e8 100%);
     background-attachment:fixed;font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:var(--faint)}
@keyframes idhalo{0%{transform:scale(.94);opacity:.55}100%{transform:scale(1.32);opacity:0}}
@keyframes idrise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
     background:var(--bg);position:relative;overflow:hidden}

/* ---- header ---- */
.hdr{flex:none;background:var(--soft);border-bottom:1px solid var(--line);
     padding:calc(env(safe-area-inset-top,12px) + 16px) 20px 16px}
.hdr .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.hmeta{font-size:11px;font-weight:600;color:var(--mut)}
.hdr .title{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.08;
            margin-top:5px;letter-spacing:-.4px;color:var(--txt)}
.gear{background:none;border:none;padding:0 0 0 8px;font-size:13px;color:var(--mut);line-height:1}

/* ---- scroll body ---- */
#body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 104px}
.view{display:none}
.view.on{display:block}
.seclabel{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
          color:var(--mut);margin:22px 4px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}


.ring{border-radius:50%;flex:none;display:grid;place-items:center}
.ring>.inner{border-radius:50%;background:var(--card);display:grid;place-items:center}
.baseline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bar{border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s,background .3s}

/* ---- today: quest ---- */
.quest{background:var(--card);border:var(--edge);border-radius:22px;
       padding:18px 18px 18px;box-shadow:var(--sh-3);animation:idrise .3s ease both}
.quest .qk{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.quest .qp{font-size:10.5px;font-weight:700;color:var(--mut)}
.quest .qc{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:9px}
.quest .qt{font-family:var(--serif);font-size:27px;font-weight:450;line-height:1.1;
           margin-top:4px;text-wrap:pretty}
.chip{display:inline-block;font-size:10.5px;font-weight:700;background:var(--chip-bg);
      color:var(--chip-txt);padding:5px 11px;border-radius:99px;margin-top:11px}
.qacts{display:flex;gap:9px;margin-top:16px}
.qacts button{border:none;font-weight:700;font-size:14px;padding:14px 16px;border-radius:14px}
.qacts .go{flex:1;background:linear-gradient(180deg,#358055,#276044);color:var(--on-acc);
           box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 14px -6px rgba(30,80,55,.5)}
.qacts .go:hover{background:var(--acc-d)}
.qacts .alt{background:var(--soft);color:var(--acc-d)}
.qacts .alt:hover{background:var(--alt-hover)}

/* ---- today: up next ---- */
.upnext{display:flex;flex-direction:column;gap:8px}
.unrow{display:flex;align-items:center;gap:12px;background:var(--card);border:var(--edge);
       box-shadow:var(--sh-1);
       border-radius:14px;padding:12px 14px;cursor:pointer}
.unrow .n{font-family:var(--serif);font-size:15px;color:var(--numeral);width:26px;flex:none}
.unrow .t{font-size:13.5px;font-weight:600;line-height:1.25;text-wrap:pretty}
.unrow .m{font-size:10.5px;color:var(--mut);margin-top:3px}

/* ---- path ---- */
.pseg{display:flex;gap:4px;background:var(--pip);border-radius:99px;padding:4px;width:max-content;margin:0 0 18px}
.pseg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--mut);padding:7px 16px;border-radius:99px;cursor:pointer}
.pseg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(24,50,32,.10)}
/* Day-by-day: the whole plan as a calendar. Read days sit where they were
   actually read; open days where the deal will put them. */
.daylist{padding:2px 0 8px}
.mhead{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:22px 2px 10px}
.daylist .mhead:first-child{margin-top:0}
.dgrp{display:flex;gap:12px;background:var(--card);border:var(--edge);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.dgrp.past{opacity:.6}
.dgrp.today{border:1.5px solid var(--acc)}
.dd{width:36px;flex:none;text-align:center;padding-top:1px}
.dd .dw{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.dd .dn{display:block;font-family:var(--serif);font-size:19px;color:var(--numeral);line-height:1.2}
.dgrp.today .dd .dw,.dgrp.today .dd .dn{color:var(--acc)}
.dd .x2{display:block;font-size:9px;font-weight:800;color:var(--behind);margin-top:1px}
.dss{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ds{display:flex;align-items:center;gap:9px;cursor:pointer}
.ds .dot{width:8px;height:8px;border-radius:99px;flex:none}
.ds .t{font-size:13px;font-weight:600;line-height:1.25;text-wrap:pretty}
.ds .m{font-size:10.5px;color:var(--mut);margin-top:2px}
.ds .ck{margin-left:auto;flex:none;color:var(--read);font-size:12px;font-weight:700}
.path{position:relative;display:flex;flex-direction:column;padding:4px 0 8px}
.pnode{display:flex;align-items:center;gap:15px;cursor:pointer;position:relative;padding-bottom:22px}
.pnode:last-child{padding-bottom:0}
.pnode.locked{opacity:.82}
.pwrap{position:relative;flex:none}
.conn{position:absolute;left:35px;top:70px;width:3px;height:24px;border-radius:99px;z-index:0}
.halo{position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--acc);
      animation:idhalo 2s ease-out infinite;pointer-events:none}
.pnode .ring{position:relative;z-index:1;width:72px;height:72px;transition:background .4s}
.pnode .ring>.inner{width:56px;height:56px;background:var(--bg)}
.pct{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1}
.pct.done{font-size:22px}
.plab{flex:1;min-width:0;text-align:left}
.plab .t{font-size:14px;font-weight:700;line-height:1.2;letter-spacing:-.1px;text-wrap:pretty}
.pnode.complete .plab .t{color:var(--gold-txt)}
.plab .m{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:3px}

/* ---- find ---- */
#findInput{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
           background:var(--card);font-family:inherit;font-size:14px;color:var(--txt);
           outline:none;margin-bottom:14px}
#findResults{display:flex;flex-direction:column;gap:10px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.grp .gk{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--acc)}
.grp .gt{font-family:var(--serif);font-size:17.5px;font-weight:500;line-height:1.2;margin-top:3px;text-wrap:pretty}
.grp .gm{font-size:10.5px;color:var(--mut);margin-top:4px}
.grows{display:flex;flex-direction:column;margin-top:10px}
.grow{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer}
.grow .p{font-size:12.5px;font-weight:600}
.grow .s{font-size:10px;color:var(--faint);margin-top:2px}
.box{flex:none;display:grid;place-items:center;font-weight:800;color:var(--on-acc);
     border:1.5px solid var(--box);background:var(--card);transition:all .15s}
.box.on{border-color:var(--acc);background:var(--acc)}
.grow .box{width:22px;height:22px;border-radius:7px;font-size:12px}
/* Read work is marked, never crossed out — the same rule as the sector sheet.
   Strikethrough reads as cancelled; this is a record of reading done. */
.grow.done .p{color:var(--acc)}
.grow.done .s{color:var(--faint)}
.gall{width:100%;margin-top:12px;font-size:12px;font-weight:700;padding:10px 12px;border-radius:11px;
      border:none;background:var(--acc);color:var(--on-acc)}
.gall.undo{background:transparent;border:1px solid var(--undo-bd);color:var(--mut)}
.empty{text-align:center;padding:44px 24px;color:var(--faint);font-size:13px;line-height:1.7}

/* ---- stats ---- */
.summary{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
         border-radius:20px;padding:18px}
.summary .ring{width:96px;height:96px}
.summary .ring>.inner{width:76px;height:76px}
.summary .big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;color:var(--acc)}
.summary .cap{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
              color:var(--faint);margin-top:3px}
.summary .lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.summary .l{font-size:11px;font-weight:600;color:var(--mut)}
.summary .v{font-size:13px;font-weight:700}
.summary .v.behind{color:var(--behind)}
.summary .v.ahead{color:var(--ahead)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;font-weight:700;padding:7px 12px;border-radius:99px;
       background:var(--track);color:var(--faint);border:1px solid var(--pill-bd)}
.badge.got{background:var(--gold-bg);color:var(--gold-txt);border-color:var(--gold-bd)}
.sectorbars{padding:6px 15px 12px}
.sbrow{padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.sbrow:last-child{border-bottom:none}
.sbrow .t{font-size:12.5px;font-weight:600;line-height:1.25;text-wrap:pretty}
.sbrow .c{font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.sbrow .bar{height:6px;background:var(--hair);margin-top:7px}
.bar>i.full{background:var(--gold)}

/* ---- today: the strip ----------------------------------------------------
   Three numbers, deliberately quiet. This is where the level ring and XP bar
   used to be; the point is that it no longer competes with the quest. */
.strip{display:flex;background:var(--card);border:var(--edge);border-radius:16px;
       box-shadow:var(--sh-1);overflow:hidden;margin:14px 0 18px}
.strip .cell{flex:1;padding:12px 8px;text-align:center}
.strip .cell + .cell{border-left:var(--edge)}
.strip .cv{font-family:var(--serif);font-size:21px;line-height:1;
           font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip .ck{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--faint);margin-top:4px;font-weight:700}
.strip .cv.behind{color:var(--behind)}

/* ---- typographic craft --------------------------------------------------
   Tabular figures anywhere a value can change. This is not neatness: with
   proportional digits a number that animates visibly jitters as glyph widths
   shift, and plan 3 animates several of them. */
.hmeta,.quest .qp,.quest .qc,.summary .v,.unrow .n,.unrow .m,
.grow .s,.sbrow .c{font-variant-numeric:tabular-nums}

/* Display serif tightens as it grows; small caps open up. */
.hdr .title{letter-spacing:-.018em}
.quest .qt{letter-spacing:-.02em}
.eyebrow,.quest .qk{letter-spacing:.19em}

/* ---- motion --------------------------------------------------------------
   Entry animations only. These run on mount, so they survive render() rebuilding
   the panel — which is exactly what CSS transitions on changing values cannot do.
   The counting numbers are handled in motion.js instead. */
@keyframes idfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes idpop{0%{transform:scale(1)}38%{transform:scale(1.05)}100%{transform:scale(1)}}
.view.on > *{animation:idfade .32s cubic-bezier(.2,.8,.3,1) both}
.view.on > *:nth-child(1){animation-delay:.02s}
.view.on > *:nth-child(2){animation-delay:.06s}
.view.on > *:nth-child(3){animation-delay:.10s}
.view.on > *:nth-child(4){animation-delay:.14s}
.unrow{animation:idfade .3s cubic-bezier(.2,.8,.3,1) both}
.unrow:nth-child(2){animation-delay:.04s}
.unrow:nth-child(3){animation-delay:.08s}
.strip.pop{animation:idpop .42s cubic-bezier(.2,.8,.3,1)}
.qacts button{transition:transform .12s cubic-bezier(.2,.8,.3,1),filter .2s}
.qacts button:active{transform:scale(.97)}

@media (prefers-reduced-motion:reduce){
  .view.on > *,.unrow,.quest,.strip.pop{animation:none !important}
  .qacts button{transition:none}
}

/* ---- tab bar ---- */
.tabs{flex:none;background:var(--tabs-bg);backdrop-filter:blur(14px);
      border-top:1px solid var(--line);display:flex;
      padding:10px 10px max(28px,env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{flex:1;background:none;border:none;padding:0;display:flex;justify-content:center}
.tabs span{font-size:12px;font-weight:600;padding:8px 14px;border-radius:99px;color:var(--mut);transition:all .15s}
.tabs button.on span{font-weight:800;color:var(--on-acc);background:var(--acc)}

/* ---- sheets ---- */
.sheet{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end}
.sheet.on{display:flex}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;background:var(--bg);border-radius:26px 26px 0 0;max-height:84%;
       display:flex;flex-direction:column;box-shadow:0 -10px 34px var(--sheet-sh);
       animation:idrise .26s ease both}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--grab);margin:0 auto 13px}
.phead{padding:10px 20px 12px;border-bottom:1px solid var(--line);flex:none}
.phead .t{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.12;
          margin-top:2px;letter-spacing:-.018em;text-wrap:pretty}
.phead .s{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.4;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phead .bar{height:4px;background:var(--sheet-track);margin-top:10px}
.pclose{background:none;border:none;font-size:11px;font-weight:700;letter-spacing:.08em;
        text-transform:uppercase;color:var(--mut);padding:0}
.pbody{flex:1;overflow-y:auto;padding:4px 20px 30px}
/* ---- sector sheet: chapters, not slices ----------------------------------
   Completed work is never struck through. Crossing something out means
   cancelled; this is a record of reading done, so finished chapters keep their
   full title and gain a quiet check on the right. */
.chgroup{padding:14px 0;border-bottom:1px solid var(--hair)}
.chhead{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.chmain{flex:1;min-width:0}
.cht{font-family:var(--serif);font-size:16.5px;line-height:1.22;letter-spacing:-.01em;text-wrap:pretty}
.chm{font-size:10.5px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.chgroup.whole .cht{color:var(--acc)}
.chgroup.whole .chm{color:var(--faint)}
.mk{flex:none;width:20px;text-align:right;font-size:13px;color:var(--acc);line-height:1.3}

.parts{margin:9px 0 0 0;border-left:2px solid var(--hair);padding-left:12px}
.part{display:flex;align-items:baseline;gap:9px;padding:5px 0;cursor:pointer;
      font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.part .pn{width:13px;color:var(--faint);font-family:var(--serif);font-size:12px}
.part .pp{flex:none}
.part .pw{flex:1;color:var(--faint)}
.part.done .pw{color:var(--read)}
.part .mk{width:14px;font-size:11px}
.chgroup .chip{font-size:10px;padding:4px 9px;margin-top:8px}

/* ---- sync sheet ---- */
.cfg .pbody{padding:16px 20px 30px}
.cfg label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;
           text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.cfg input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
           background:var(--card);font-family:inherit;font-size:13px;color:var(--txt);outline:none}
.cfg .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cfg .btns button{flex:1 1 46%;font-size:12.5px;font-weight:700;padding:11px 12px;border-radius:12px;
                  border:1px solid var(--line);background:var(--card);color:var(--acc-d)}
.cfg .btns button.primary{border:none;background:var(--acc);color:var(--on-acc)}
.cfg .status{font-size:11.5px;color:var(--mut);margin-top:14px;line-height:1.5}
.cfg .fine{font-size:10.5px;color:var(--faint);margin-top:12px;line-height:1.6}

#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
       background:var(--txt);color:var(--on-acc);font-size:12px;font-weight:600;
       padding:9px 15px;border-radius:99px;opacity:0;pointer-events:none;transition:all .2s;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <div class="row">
      <span class="eyebrow" id="hEyebrow"></span>
      <span class="hmeta"><span id="hMeta"></span><button class="gear" id="gearBtn" title="Sync settings">⚙</button></span>
    </div>
    <div class="title" id="hTitle"></div>
  </div>

  <div id="body">
    <div class="view" id="v-today">
      <div id="questCard"></div>
      <div class="strip" id="statStrip"></div>
      <div class="seclabel">Up next</div>
      <div class="upnext" id="upNext"></div>
    </div>

    <div class="view" id="v-path">
      <div class="pseg" id="pathSeg">
        <button class="on" data-pview="tree">Sectors</button>
        <button data-pview="days">Day by day</button>
      </div>
      <div class="path" id="pathList"></div>
      <div class="daylist" id="dayList" style="display:none"></div>
    </div>

    <div class="view" id="v-find">
      <input id="findInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="Search a topic or chapter — salmonella, 44">
      <div id="findResults"></div>
    </div>

    <div class="view" id="v-stats">
      <div id="statSummary"></div>
      <div class="seclabel" id="badgeLabel"></div>
      <div class="badges" id="badges"></div>
      <div class="seclabel">By sector</div>
      <div class="card sectorbars" id="sectorBars"></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="today"><span>Today</span></button>
    <button data-tab="path"><span>Path</span></button>
    <button data-tab="find"><span>Find</span></button>
    <button data-tab="stats"><span>Stats</span></button>
  </div>

  <div class="sheet" id="sheet">
    <div class="scrim" data-close="sheet"></div>
    <div class="panel">
      <div class="phead">
        <div class="grabber"></div>
        <div class="row" style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span class="eyebrow">Sector</span>
          <button class="pclose" data-close="sheet">Close</button>
        </div>
        <div class="t" id="sheetTitle"></div>
        <div class="s" id="sheetSub"></div>
        <div class="bar"><i id="sheetBar"></i></div>
      </div>
      <div class="pbody" id="sheetRows"></div>
    </div>
  </div>

  <div class="sheet cfg" id="cfgSheet">
    <div class="scrim" data-close="cfgSheet"></div>
    <div class="panel">
      <div class="phead">
        <div class="grabber"></div>
        <div class="row" style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span class="eyebrow">Sync</span>
          <button class="pclose" data-close="cfgSheet">Close</button>
        </div>
        <div class="t">Progress &amp; devices</div>
        <div class="s">Progress lives on this device and travels between devices through a private GitHub Gist.</div>
      </div>
      <div class="pbody">
        <label for="cfgToken">Gist token</label>
        <input id="cfgToken" type="password" autocomplete="off" placeholder="github_pat_…">
        <label for="cfgGist">Gist ID</label>
        <input id="cfgGist" type="text" autocomplete="off" placeholder="a1b2c3…">
        <div class="btns">
          <button class="primary" id="cfgSave">Save &amp; sync</button>
          <button id="cfgSync">Sync now</button>
          <button id="cfgExport">Export</button>
          <button id="cfgImport">Import</button>
        </div>
        <input id="cfgFile" type="file" accept="application/json" style="display:none">
        <div class="status" id="cfgStatus"></div>
        <div class="fine">The token is stored only on this device and is Gist-scoped. Treat it like a password — revoke it on GitHub if a device is lost.</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="schedule.js"></script>
<script src="sync.js"></script>
<script src="copy.js"></script>
<script src="motion.js"></script>
<script src="app.js"></script>
</body></html>
