<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ID · Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070510;--panel:#0d0a1c;--panel2:#130e28;--line:#241b40;--line2:#191233;
  --vio:#7b5cff;--vio2:#ab97ff;--cyan:#37e6cf;--gold:#ffce5c;--rose:#ff5c9d;
  --txt:#e9e4ff;--soft:#b7b0e0;--dim:#8981b3;--faint:#4d4770;
  --disp:"Chakra Petch",system-ui,sans-serif;--num:"Rajdhani",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--disp);min-height:100vh;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 600px at 78% -8%,rgba(123,92,255,.16),transparent 60%),
  radial-gradient(760px 520px at 6% 12%,rgba(55,230,207,.10),transparent 58%),
  radial-gradient(700px 700px at 50% 108%,rgba(255,92,157,.08),transparent 60%),
  radial-gradient(130% 120% at 50% 40%,transparent 58%,rgba(0,0,0,.6) 100%)}
body:after{content:none}
.tnum{font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:0;z-index:60;background:#0c0a1a;border-bottom:1px solid var(--line)}
.hud .in{max-width:1080px;margin:0 auto;padding:12px 26px;display:flex;align-items:center;gap:20px}
.lvl{display:flex;align-items:center;gap:11px;flex:none}
.lvl .badge{font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.5px;color:#0a0616;background:linear-gradient(135deg,var(--vio2),var(--vio));padding:5px 11px;border-radius:8px;box-shadow:0 0 18px rgba(123,92,255,.5)}
.lvl .rank{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.lvl .rank b{color:var(--vio2);display:block;font-size:11px}
.xpwrap{flex:1;min-width:0}
.xptop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:5px}
.xptop b{color:var(--cyan)}
.xpbar{height:7px;background:#140f2c;border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--line2)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--cyan));box-shadow:0 0 14px rgba(55,230,207,.5);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.xpbar i:after{content:none}
@keyframes sheen{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.hstats{flex:none;display:flex;gap:18px}
.hstat{text-align:right}
.hstat .v{font-family:var(--num);font-weight:700;font-size:19px;color:var(--txt);line-height:1}
.hstat .v.warn{color:var(--gold)}
.hstat .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.jbtn{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:rgba(55,230,207,.08);border:1px solid rgba(55,230,207,.3);padding:8px 12px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.jbtn:hover{background:rgba(55,230,207,.16);box-shadow:0 0 16px rgba(55,230,207,.3)}

/* quest banner */
.quest{max-width:1080px;margin:18px auto 0;padding:0 26px;position:relative;z-index:1}
.qcard{background:linear-gradient(120deg,rgba(55,230,207,.10),var(--panel) 60%);border:1px solid rgba(55,230,207,.28);border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.qcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}
.qcard .qk{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.qcard .qt{font-size:19px;font-weight:600;letter-spacing:-.2px;margin-top:3px}
.qcard .qm{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}
.qcard .qm b{color:var(--vio2)}
.qcard .qacts{margin-left:auto;display:flex;gap:9px;flex:none}
.qbtn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;border-radius:9px;cursor:pointer;border:1px solid;transition:all .15s;white-space:nowrap}
.qbtn.go{color:#07120f;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(55,230,207,.4)}
.qbtn.go:hover{filter:brightness(1.1)}
.qbtn.ghost{color:var(--vio2);background:rgba(123,92,255,.08);border-color:rgba(123,92,255,.34)}
.qbtn.ghost:hover{background:rgba(123,92,255,.18)}

/* tree */
.treewrap{position:relative;z-index:1;overflow-x:auto;padding:34px 0 40px}
.tree{position:relative;width:720px;margin:0 auto}
.tree svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.act{position:absolute;left:0;right:0;text-align:center;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}
.act b{color:var(--vio2)}
.act:before,.act:after{content:"";display:inline-block;width:60px;height:1px;background:var(--line);vertical-align:middle;margin:0 14px}
.term{position:absolute;left:0;right:0;text-align:center;z-index:2;font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.node{position:absolute;width:150px;z-index:3;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0;font-family:inherit}
.orb{position:relative;width:92px;height:92px;display:grid;place-items:center;transition:transform .18s}
.node:hover .orb{transform:scale(1.06)}
.orb svg.ring{position:absolute;inset:0;width:92px;height:92px;transform:rotate(-90deg)}
.orb .rbg{fill:rgba(20,15,40,.7);stroke:var(--line);stroke-width:6}
.orb .rfg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.orb .ix{font-family:var(--num);font-weight:700;font-size:30px;position:relative;line-height:1}
.orb .glyph{position:absolute;bottom:9px;font-size:11px}
.ntitle{font-size:13px;font-weight:600;line-height:1.15;text-align:center;letter-spacing:-.1px;max-width:150px}
.nmeta{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
/* node states */
.node.locked{opacity:.4;filter:saturate(.4)}
.node.locked .ix{color:var(--faint)}
.node.locked .rfg{stroke:var(--faint)}
.node.locked .ntitle{color:var(--dim);font-weight:500}
.node.available .ix,.node.started .ix{color:var(--vio2)}
.node.available .rfg,.node.started .rfg{stroke:var(--vio)}
.node.available .orb,.node.started .orb{filter:drop-shadow(0 0 10px rgba(123,92,255,.35))}
.node.complete .ix{color:var(--gold)}
.node.complete .rfg{stroke:var(--gold)}
.node.complete .orb{filter:drop-shadow(0 0 14px rgba(255,206,92,.45))}
.node.complete .glyph{color:var(--gold)}
.node.complete .ntitle{color:var(--soft)}
.node.active .ix{color:var(--cyan)}
.node.active .rfg{stroke:var(--cyan)}
.node.active .ntitle{color:#dffff9}
.node.active .orb{filter:drop-shadow(0 0 16px rgba(55,230,207,.55))}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.node.active .orb:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(55,230,207,.35);animation:halo 1.9s ease-out infinite}
@keyframes halo{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}

/* detail panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-14px 0 50px rgba(0,0,0,.6);z-index:100;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.phead{padding:22px 22px 16px;border-bottom:1px solid var(--line2);position:relative}
.phead .pclose{position:absolute;right:16px;top:16px;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
.phead .pk{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--vio2)}
.phead .pt{font-size:22px;font-weight:600;letter-spacing:-.3px;margin:6px 40px 10px 0;line-height:1.1}
.phead .psub{font-family:var(--mono);font-size:11px;color:var(--dim)}
.phead .pbar{height:6px;background:#140f2c;border-radius:4px;margin-top:12px;overflow:hidden;border:1px solid var(--line2)}
.phead .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--cyan));box-shadow:0 0 12px rgba(55,230,207,.5)}
.pbody{overflow-y:auto;padding:8px 0 26px;flex:1}
.pwk{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:14px 22px 6px}
.q{display:flex;align-items:flex-start;gap:12px;padding:11px 22px;border-top:1px solid var(--line2);transition:background .12s}
.q:hover{background:var(--panel2)}
.q .chk{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--faint);border-radius:6px;cursor:pointer;position:relative;transition:all .15s}
.q:hover .chk{border-color:var(--cyan)}
.q.done .chk{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(55,230,207,.5)}
.q.done .chk:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #07120f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.q .qmid{flex:1;min-width:0}
.q .qttl{font-size:14px;font-weight:500;line-height:1.3}
.q.done .qttl{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.q .qsub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.q .qsub .pg{color:var(--vio2)}
.q .qsub .bc{color:var(--cyan)}
.q .qsub .bq{color:var(--faint)}
.q .qacts{display:flex;gap:6px;margin-top:8px}
.mbtn{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:rgba(123,92,255,.06);color:var(--vio2);transition:all .13s}
.mbtn:hover{border-color:var(--vio);background:rgba(123,92,255,.16)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid rgba(55,230,207,.4);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:11px 18px;border-radius:10px;z-index:200;opacity:0;transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(4,3,10,.62);z-index:99;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
body.loading .treewrap,body.loading .quest{opacity:.4;pointer-events:none}

@media(max-width:720px){
  .hud .in{flex-wrap:wrap;gap:12px;padding:11px 16px}.xpwrap{order:3;flex-basis:100%}
  .hstats{gap:12px}.quest{padding:0 16px}.qcard{flex-wrap:wrap}.qcard .qacts{margin-left:0;width:100%}
}
.chapgen{display:flex;align-items:center;gap:10px;padding:10px 22px 4px}
.cglabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--vio2)}
.cgstatus{font-family:var(--mono);font-size:10px;color:var(--dim)}
.gbtn{border-color:var(--cyan) !important;color:var(--cyan) !important;background:rgba(55,230,207,.06) !important}
.dz{margin:2px 22px 8px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;cursor:pointer}
.dz.hot{border-color:var(--cyan);color:var(--cyan)}
.tray{margin:2px 22px 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tcard{padding:10px 12px;border-top:1px solid var(--line2)}
.tcard textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:6px;resize:vertical;min-height:38px;margin-bottom:4px}
.tcard .trow{display:flex;gap:8px;align-items:center;margin-top:6px}
.tcard.dropped{opacity:.4}
.tray .tfoot{padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--panel2)}
.qtray{margin:2px 22px 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qq{padding:12px;border-top:1px solid var(--line2)}
.qq .qstem{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--sans);font-size:13px;padding:7px;min-height:52px;resize:vertical}
.qq .sub{margin:8px 0 0;padding:8px;border:1px solid var(--line2);border-radius:8px}
.qq .sub .sp{display:flex;gap:8px;align-items:center}
.qq .sub .sp input.p{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:5px}
.qq .sub .sp input.m{width:52px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:5px;text-align:center}
.qq .ans{display:flex;gap:6px;align-items:center;margin-top:5px}
.qq .ans input{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:5px}
.qq.dropped{opacity:.4}
.qtray .tfoot{padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--panel2)}
.q .qsub .dt{color:var(--dim)}
.q .qsub .dt.overdue{color:var(--gold)}
.q .qsub .dt.today{color:var(--cyan);font-weight:600}
.pwkdt{color:var(--faint);font-weight:400}
.q .qacts{flex-wrap:wrap;gap:6px 8px}
.xbtn,.cxbtn{border-color:var(--gold) !important;color:var(--gold) !important;background:rgba(255,206,92,.06) !important}
</style>
</head><body class="loading">
<div class="hud"><div class="in">
  <div class="lvl"><span class="badge" id="lvlBadge">LVL 1</span><span class="rank"><b id="rankName">Initiate</b><span id="rankSub">0 sectors cleared</span></span></div>

  <div class="hstats">

</div></div>

<div class="quest"><div class="qcard" id="quest"></div></div>

<div class="treewrap"><div class="tree" id="tree"></div></div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel">
  <div class="phead"><button class="pclose" id="pclose">×</button><div class="pk" id="pk"></div><div class="pt" id="pt"></div><div class="psub" id="psub"></div><div class="pbar"><i id="pbar"></i></div></div>
  <div class="pbody" id="pbody"></div>
</aside>
<div class="toast" id="toast"></div>

  // act dividers + terminals
  var y1start=secs.findIndex(function(x){return x.s.year===1;});
  var y2start=secs.findIndex(function(x){return x.s.year===2;});
  var acts="";
  acts+='<div class="term" style="top:18px;font-size:12px;color:var(--vio2)">▸ The journey begins</div>';
  if(y2start>0){ acts+='<div class="act" style="top:'+(nodeY(y2start)-GAP/2-6)+'px"><b>Act II</b> · Consolidation &amp; Exam Prep</div>'; }
  acts+='<div class="term" style="top:'+(height-70)+'px;font-size:15px;color:var(--gold);text-shadow:0 0 20px rgba(255,206,92,.4)">◆ The Royal College Examination</div>';
  tree.innerHTML='<svg class="edges" viewBox="0 0 '+W+' '+height+'" preserveAspectRatio="none">'+edges+'</svg>'+acts+nodes;
  Array.prototype.forEach.call(tree.querySelectorAll(".node"),function(n){n.onclick=function(){openPanel(+n.dataset.si);};});
}

var openSi=null;
function openPanel(si){
  openSi=si;
  var x=META.secs[si], s=x.s;
  document.getElementById("pk").textContent="Sector "+String(si+1).padStart(2,"0")+" · "+(s.year===1?"Act I":"Act II");
  document.getElementById("pt").textContent=s.title;
  document.getElementById("psub").textContent=x.dn+" / "+x.tot+" sessions · "+x.ppd+" / "+x.pp+" pp · "+Math.round(x.frac*100)+"%";
  document.getElementById("pbar").style.width=(x.frac*100)+"%";
  var body=document.getElementById("pbody"), html="", lastWk=null;
  var todayIdx=studyIdx(Date.now()), flexToday=isFlexDay(new Date());
  s.rows.forEach(function(r){
    var dn=isDone(r.id);
    if(r.wk!==lastWk){ html+='<div class="pwk">Week '+r.wk+' <span class="pwkdt">· '+fmtD(dayDate((r.wk-1)*7))+' – '+fmtD(dayDate((r.wk-1)*7+6))+'</span></div>'; lastWk=r.wk; }
    html+='<div class="q'+(dn?' done':'')+'" data-id="'+r.id+'">'
      +'<div class="chk" data-toggle="'+r.id+'"></div>'
      +'<div class="qmid"><div class="qttl">'+esc(r.r)+'</div>'
      +'<div class="qsub"><span class="dt'+(!dn&&r.gi<todayIdx?' overdue':(!flexToday&&r.gi===todayIdx?' today':''))+'">'+(!flexToday&&r.gi===todayIdx?'Today · ':'')+fmtD(dayDate(r.gi))+'</span>'+(r.ps?'<span class="pg">pp. '+r.ps+(r.pe&&r.pe!==r.ps?'–'+r.pe:'')+'</span>':'')+'</div>'
      +'</div></div>';
  });
  body.innerHTML=html;
  Array.prototype.forEach.call(body.querySelectorAll(".chk"),function(el){el.onclick=function(){toggle(el.dataset.toggle);};});
  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("on");
}
function closePanel(){document.getElementById("panel").classList.remove("open");document.getElementById("scrim").classList.remove("on");openSi=null;}

function rowById(id){for(var i=0;i<SECTIONS.length;i++){var r=SECTIONS[i].rows.find(function(x){return x.id===id;});if(r)return r;}return null;}

function toggle(id){
  var now=!isDone(id);
  STATUS.done[id]={done:now,doneAt:now?new Date().toISOString():null};
  render();
  if(openSi!==null) openPanel(openSi);
  api("/api/session/"+encodeURIComponent(id)+"/done",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:now})})
    .catch(function(){toastMsg("Sync failed — will retry on reload");});
}


var toastT=null;
function toastMsg(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("show");},2600);}

function warpToActive(){
  var n=document.querySelector('.node.active')||document.querySelector('.node');
  if(n) n.scrollIntoView({behavior:"smooth",block:"center"});
}

document.getElementById("pclose").onclick=closePanel;
document.getElementById("scrim").onclick=closePanel;
document.getElementById("jump").onclick=warpToActive;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePanel();});

function refreshFromStore(){
  STATUS={done: IDStore.getState().sessions};
  render();
  if(openSi!==null) openPanel(openSi);
}
function applyTreeZoom(){
  var t=document.getElementById("tree"); if(!t) return;
  var vw=document.documentElement.clientWidth;
  if(vw<=640){ t.style.zoom=Math.max(0.4, Math.min(1,(vw-16)/720)); }
  else { t.style.zoom=""; }
}
window.addEventListener("resize", applyTreeZoom);
function boot(){
  api("/api/status").then(function(s){STATUS=s;}).catch(function(){STATUS={done:{}};})
    .then(function(){
      document.body.classList.remove("loading");
      render();
      applyTreeZoom();
      setTimeout(warpToActive,500);
      if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
      IDSync.start(refreshFromStore);
    });
}
boot();
</script>
</body></html>
